name: Build shubenOS ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Build ISO inside Debian 12
        run: docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm bash build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: shubenOS-1.0-amd64-iso
          path: |
            shubenOS-1.0-amd64.iso
            shubenOS-1.0-amd64.iso.sha256
          compression-level: 0
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
